# v++ link config for the Alveo U55C.
#
# The U55C has NO DDR -- it is HBM-only (16 GB HBM2, banks HBM[0:31]). A kernel
# whose m_axi bundles are left to default placement links against DDR on a U280
# and fails on a U55C, so every bundle is pinned to an HBM bank explicitly.
#
# The CU instance name is <kernel>_1 for a single compute unit.
# Buffers here are one 64-byte word per query, so one bank each is ample.
[connectivity]
sp=graph_engine_part_1.m_axi_gmem0:HBM[0]
sp=graph_engine_part_1.m_axi_gmem1:HBM[1]
sp=graph_engine_part_1.m_axi_gmem2:HBM[2]
