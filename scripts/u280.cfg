# v++ link config for the Alveo U280.
#
# The U280 has both HBM and DDR, so the bundles would place without this. They
# are pinned to HBM anyway, matching scripts/u55c.cfg bank for bank: the point
# of building the same partitioned design on both cards is to compare exchange
# latency, and that comparison is only clean if the memory path is the same on
# each. The platform then becomes the only difference between the two builds.
[connectivity]
sp=graph_engine_part_1.m_axi_gmem0:HBM[0]
sp=graph_engine_part_1.m_axi_gmem1:HBM[1]
sp=graph_engine_part_1.m_axi_gmem2:HBM[2]
